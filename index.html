<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1013" media="(prefers-color-scheme: dark)" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Quản lý công việc bộ phận Sản phẩm</title>
    <meta name="description" content="Hệ thống quản lý và cập nhật nhanh tiến độ công việc hàng ngày của các nhóm Product Manager, UX/UI Designer, SEO và Data theo chuẩn thiết kế VnExpress." />
    <meta property="og:title" content="Quản lý công việc bộ phận Sản phẩm" />
    <meta property="og:description" content="Hệ thống quản lý và cập nhật nhanh tiến độ công việc hàng ngày của các nhóm Product Manager, UX/UI Designer, SEO và Data theo chuẩn thiết kế VnExpress." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- VnExpress Design System 0.5.0 (bản phát hành, tự host trong public/vds) -->
    <link rel="stylesheet" href="/vds/0.5.0/fonts/vds-fonts.css" />
    <link rel="stylesheet" href="/vds/0.5.0/tokens/vds.css" />
    <link rel="stylesheet" href="/vds/0.5.0/components/vds-components.css" />
    <script>
      // Giao diện sáng/tối theo VDS: data-theme trên <html>, chạy trước khi vẽ để không nháy màu
      (function () {
        try {
          var pref = localStorage.getItem('wms_theme') || 'light';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-surface-selected selection:text-accent">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
